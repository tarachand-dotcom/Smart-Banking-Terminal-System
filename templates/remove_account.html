<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Remove Account</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
  <header class="header">
    <div class="header-content">
      <h1>🗑️ Remove Account</h1>
    </div>
  </header>

  <main class="main-content">
    <div class="form-container">
      <form method="POST">
        <div class="form-group">
          <label>Account Number</label>
          <input type="text" name="acc_no" required>
        </div>
        <button type="submit" class="btn-danger btn-full">Remove Account</button>
      </form>
      <a href="{{ url_for('admin_dashboard') }}" class="btn-back">← Back</a>
    </div>
  </main>
  <div id="flash-container" class="flash-popup-container">
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    {% for category, message in messages %}
    <div class="flash-popup {{ category }}">
      <span>{{ message }}</span>
      <button class="close-flash" onclick="this.parentElement.style.display='none';">&times;</button>
    </div>
    {% endfor %}
    {% endif %}
    {% endwith %}
  </div>
</body>

</html>
