<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User Login - Enter Account Number</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>

<body>
    <header class="header">
        <div class="header-content">
            <h1><i class="fas fa-university"></i> ATM System</h1>

        </div>
    </header>

    <main class="main-content">
        <div class="login-container">
            <div class="login-card">
                <h2><i class="fas fa-user"></i> User Login</h2>

                <form method="POST" action="{{ url_for('user_login') }}">
                    <div class="form-group">
                        <label for="acc_no"><i class="fas fa-sign-in-alt"></i> Enter Account Number</label><br>
                        <input type="text" name="acc_no" id="acc_no" placeholder="Enter your account number" required>
                    </div>
                    <button type="submit" class="btn-primary btn-full">
                        Next <i class="fas fa-arrow-right"></i>
                    </button>
                    <a href="{{ url_for('home') }}" class="btn-back">← Back</a>
                </form>

                <!-- {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    <div class="flash-messages">
                        {% for category, message in messages %}
                            <p class="flash {{ category }}">{{ message }}</p>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %} -->
            </div>
        </div>
    </main>
    <div id="flash-container" class="flash-popup-container">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="flash-popup {{ category }}">
            <span>{{ message }}</span>
            <button class="close-flash" onclick="this.parentElement.style.display='none';">&times;</button>
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}
    </div>

</body>

</html>
