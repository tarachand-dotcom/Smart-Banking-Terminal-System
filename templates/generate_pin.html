<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Generate PIN - New User</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>

<body>
    <header class="header">
        <div class="header-content">
            <h1><i class="fas fa-university"></i> ATM System</h1>

        </div>
    </header>

    <main class="main-content">
        <div class="login-container">
            <div class="login-card">
                <h2><i class="fas fa-key"></i> Generate New PIN</h2>

                <form method="POST" action="{{ url_for('generate_pin', acc_no=acc_no) }}">
                    <div class="form-group">
                        <label for="new_pin1">Enter New 4-Digit PIN</label>
                        <input type="password" name="new_pin1" id="new_pin1" maxlength="4" pattern="\d{4}" required>
                    </div>

                    <div class="form-group">
                        <label for="new_pin2">Confirm PIN</label>
                        <input type="password" name="new_pin2" id="new_pin2" maxlength="4" pattern="\d{4}" required>
                    </div>

                    <button type="submit" class="btn-primary btn-full">
                        <i class="fas fa-check-circle"></i> Generate PIN
                    </button>
                    <a href="{{ url_for('user_login') }}" class="btn-back">← Back</a>
                </form>

                <!-- {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    <div class="flash-messages">
                        {% for category, message in messages %}
                            <p class="flash {{ category }}">{{ message }}</p>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %} -->
            </div>
        </div>
    </main>
    <div id="flash-container" class="flash-popup-container">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="flash-popup {{ category }}">
            <span>{{ message }}</span>
            <button class="close-flash" onclick="this.parentElement.style.display='none';">&times;</button>
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}
    </div>

</body>

</html>
